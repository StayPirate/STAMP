name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Verify Dockerfile Python version matches .python-version
        working-directory: backend
        run: |
          EXPECTED=$(cat .python-version)
          ACTUAL=$(grep -oP '(?<=ARG PYTHON_VERSION=)\S+' Dockerfile)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Dockerfile ARG PYTHON_VERSION=$ACTUAL does not match .python-version=$EXPECTED"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uvx ruff@0.15.22 check .
      - run: uvx ruff@0.15.22 format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check Alembic migration drift
        run: |
          uv run alembic upgrade head
          uv run alembic check

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Run bandit (static analysis)
        run: uvx bandit@1.9.4 -r app/
      - name: Run pip-audit (dependency vulnerabilities)
        run: uvx pip-audit@2.10.1 --requirement <(uv export --no-hashes --no-dev)
