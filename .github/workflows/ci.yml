name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-lint:
    name: Backend Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - name: Verify Dockerfile Python version matches .python-version
        working-directory: backend
        run: |
          EXPECTED=$(cat .python-version)
          ACTUAL=$(grep -oP '(?<=ARG PYTHON_VERSION=)\S+' Dockerfile)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::Dockerfile ARG PYTHON_VERSION=$ACTUAL does not match .python-version=$EXPECTED"
            exit 1
          fi
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uvx ruff@0.15.22 check .
      - run: uvx ruff@0.15.22 format --check .

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sentinel
          POSTGRES_PASSWORD: sentinel
          POSTGRES_DB: sentinel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@localhost:5432/sentinel_test
      REDIS_URL: redis://localhost:6379/0
      CELERY_BROKER_URL: redis://localhost:6379/1
      JWT_SECRET_KEY: ci-test-secret-key-not-for-production-min-32-chars
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -v --cov=app --cov-report=term-missing --cov-fail-under=85
      - name: Check Alembic migration drift
        run: |
          uv run alembic upgrade head
          uv run alembic check

  backend-security:
    name: Backend Security Scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Run bandit (static analysis)
        run: uvx bandit@1.9.4 -r app/
      - name: Run pip-audit (dependency vulnerabilities)
        run: uvx pip-audit@2.10.1 --requirement <(uv export --no-hashes --no-dev --no-emit-project)

  shell-lint:
    name: Shell Lint
    runs-on: ubuntu-latest
    env:
      SHELLCHECK_VERSION: "0.11.0"
      SHFMT_VERSION: "3.13.1"
      ACTIONLINT_VERSION: "1.7.12"
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned shell tooling
        run: |
          set -euo pipefail
          tools_dir="${RUNNER_TEMP}/shell-tools"
          mkdir -p "${tools_dir}"

          # Install shellcheck (tar.xz; binary at shellcheck-v<ver>/shellcheck)
          curl -fsSL -o "${tools_dir}/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          tar -xJf "${tools_dir}/shellcheck.tar.xz" -C "${tools_dir}"
          mv "${tools_dir}/shellcheck-v${SHELLCHECK_VERSION}/shellcheck" "${tools_dir}/shellcheck"

          # Install shfmt (single static binary)
          curl -fsSL -o "${tools_dir}/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"

          # Install actionlint (tar.gz containing the actionlint binary)
          curl -fsSL -o "${tools_dir}/actionlint.tar.gz" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf "${tools_dir}/actionlint.tar.gz" -C "${tools_dir}" actionlint

          chmod +x "${tools_dir}/shellcheck" "${tools_dir}/shfmt" "${tools_dir}/actionlint"
          echo "${tools_dir}" >>"${GITHUB_PATH}"
      - name: Verify pinned tool versions
        run: |
          set -euo pipefail
          shellcheck --version
          shfmt --version
          actionlint --version
      - name: Run shellcheck + shfmt on shell scripts and hooks
        run: |
          set -euo pipefail
          # Discover tracked shell files dynamically so newly added scripts
          # and hooks are covered automatically (no static list to maintain).
          # Mirrors the in-scope definition used by .githooks/pre-commit:
          #   '*.sh'        -> every tracked .sh file anywhere in the repo
          #   '.githooks/*' -> extension-less bash hooks
          # git ls-files respects .gitignore (never picks up .venv/, etc.).
          # NUL-safe read + sort -zu de-duplicates (patterns are disjoint in
          # practice, but be safe).
          mapfile -d '' -t shell_files < <(
            git ls-files -z '*.sh' '.githooks/*' | sort -z -u
          )
          if [[ ${#shell_files[@]} -eq 0 ]]; then
            echo "No tracked shell files found; nothing to lint."
            exit 0
          fi
          printf 'Linting %d shell file(s):\n' "${#shell_files[@]}"
          printf '  %s\n' "${shell_files[@]}"
          shellcheck "${shell_files[@]}"
          shfmt -i 4 -ci -d "${shell_files[@]}"
      - name: Run actionlint (workflows)
        run: |
          set -euo pipefail
          actionlint

  image-smoke:
    name: Image Smoke Test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SMOKE_IMAGE: sentinel-backend:smoke
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
      - name: Read Python version from .python-version
        id: python-version
        run: echo "version=$(cat backend/.python-version)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image (load only, no push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: PYTHON_VERSION=${{ steps.python-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Image smoke test (blocking gate)
        env:
          SENTINEL_IMAGE: ${{ env.SMOKE_IMAGE }}
          # Force Docker: the image is loaded into the Docker daemon
          # (buildx --load) and the podman socket is not running on the
          # runner, so the script's auto-detection (podman first) would
          # fail. See scripts/image-smoke.sh (COMPOSE_CMD).
          COMPOSE_CMD: "docker compose"
        run: ./scripts/image-smoke.sh --no-build
