name: Cleanup Container Images

on:
  # Weekly cadence keeps the ghcr-cleanup-action's manifest cache warm —
  # GitHub evicts cache entries unused for 7+ days.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Untagged Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Removes untagged image digests left behind when :master/:latest
      # get re-tagged on every push (see build-images.yml).
      #
      # keep-n-untagged already implies deleting all untagged versions
      # beyond the N most recent — delete-untagged must NOT be set
      # alongside it, the action rejects the combination as conflicting.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 10
          older-than: 7 days
          token: ${{ secrets.GITHUB_TOKEN }}
