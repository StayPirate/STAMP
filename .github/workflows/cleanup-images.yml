name: Cleanup Container Images

on:
  # Weekly cadence keeps the ghcr-cleanup-action's manifest cache warm —
  # GitHub evicts cache entries unused for 7+ days.
  schedule:
    - cron: "0 3 * * 0"
  workflow_dispatch:

jobs:
  cleanup:
    name: Cleanup Untagged Images
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      # Removes untagged image digests left behind when :master/:latest
      # get re-tagged on every push (see build-images.yml). Tagged images
      # (release tags, latest, master) are never affected by
      # keep-n-untagged — the two pools are independent, so this only
      # bounds the untagged pool, regardless of how many tagged images
      # exist.
      #
      # No older-than filter: retagging on every push to master keeps
      # producing untagged versions younger than any reasonable age
      # threshold, so an age filter would leave the untagged pool
      # effectively unbounded between runs. keep-n-untagged alone bounds
      # it to a fixed ceiling (the 10 most recent untagged versions)
      # regardless of age.
      #
      # keep-n-untagged already implies deleting all untagged versions
      # beyond the N most recent — delete-untagged must NOT be set
      # alongside it, the action rejects the combination as conflicting.
      - uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          keep-n-untagged: 10
          token: ${{ secrets.GITHUB_TOKEN }}
