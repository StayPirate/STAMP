name: Image Vulnerability Scan

# Weekly, non-blocking scan of the published backend image for OS-level
# vulnerabilities. See docs/deployment.md (Image Vulnerability
# Monitoring) for the full rationale: pip-audit already gates Python
# dependencies on every merge, but the Debian base layer
# (python:3.13-slim) is otherwise unmonitored for known vulnerabilities.
# Dependabot cannot help: the base image is pinned via ARG-templated
# values in backend/Dockerfile, which Dependabot's docker ecosystem
# parser does not resolve (dependabot/dependabot-core#2057). This
# workflow's Trivy scan is the only mechanism that detects known
# vulnerabilities in this layer.
#
# This workflow never fails the run because of scan findings and never
# touches build-images.yml or the publish path. Fixable HIGH/CRITICAL
# findings open or update a single tracking issue; the complete report
# (all severities, informational) is uploaded as an artifact.

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:

concurrency:
  group: image-scan
  cancel-in-progress: false

permissions:
  packages: read
  issues: write

env:
  SECURITY_LABEL: security
  ISSUE_TITLE: "Weekly image scan: fixable HIGH/CRITICAL vulnerabilities detected"

jobs:
  image-scan:
    name: Scan Published Image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Compute lowercase image reference
        id: image
        run: |
          set -euo pipefail
          repo_lower=$(printf '%s' "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "ref=ghcr.io/${repo_lower}:latest" >>"${GITHUB_OUTPUT}"

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Fixable-only scan: drives issue creation/update. Restricted to
      # vuln-type "os" — Python dependency vulnerabilities are already
      # gated by pip-audit on every merge (see ci.yml, backend-security);
      # this workflow exists specifically for the unmonitored OS layer.
      # scanners is restricted to "vuln": Trivy's secret scanner is
      # deliberately not enabled here — no CI job or Action performs
      # secret scanning (see docs/features/platform/testing-strategy.md,
      # Pre-Commit Hooks); that coverage is local-only via gitleaks.
      #
      # No explicit Trivy binary `version` is pinned here — deliberately.
      # aquasecurity/trivy-action bundles its own default Trivy version in
      # action.yml, and that default is bumped by the action's maintainers
      # on every action release. Letting the scan follow that default means
      # the Trivy binary version advances automatically whenever Dependabot
      # bumps aquasecurity/trivy-action (already tracked by the
      # `github-actions` ecosystem in dependabot.yml), instead of requiring
      # a separate manual bump of a pinned string that Dependabot cannot
      # see. Do not reintroduce a `version:` pin without updating this note.
      - name: Scan for fixable HIGH/CRITICAL OS vulnerabilities
        id: trivy-fixable
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          output: trivy-fixable.txt
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: "os"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"

      # Complete report: every OS-level finding regardless of fix
      # availability or severity, for awareness only. Never fails the
      # run (exit-code 0).
      - name: Generate complete vulnerability report
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.image.outputs.ref }}
          format: table
          output: trivy-full.txt
          exit-code: "0"
          ignore-unfixed: false
          vuln-type: "os"
          scanners: "vuln"
          skip-setup-trivy: true

      - name: Upload complete vulnerability report artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: trivy-full.txt
          retention-days: 90
          # Single-file direct upload (no zip): the artifact name
          # matches the file name (trivy-full.txt) and is readable
          # without downloading and extracting an archive first.
          archive: false

      # Only reached when the fixable-only scan (above) found at least
      # one HIGH/CRITICAL vulnerability (exit-code 1, captured as
      # `outcome: failure` because of continue-on-error). Opens a new
      # issue, or updates the existing open one so consecutive runs
      # never create a duplicate.
      - name: Open or update tracking issue for fixable findings
        if: steps.trivy-fixable.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          body_file=$(mktemp)
          {
            echo "Automated weekly scan of \`${{ steps.image.outputs.ref }}\` found fixable HIGH/CRITICAL OS-level vulnerabilities."
            echo ""
            echo "This scan is non-blocking by design (see \`docs/deployment.md\`, Image Vulnerability Monitoring). Remediation requires a maintainer to manually update \`PYTHON_BASE_DIGEST\` in \`backend/Dockerfile\` to the current \`python:3.13-slim\` digest — the base image is pinned and Dependabot cannot refresh it automatically (see \`docs/deployment.md\`, Container Build Conventions → Base image pinning)."
            echo ""
            echo "<details><summary>Fixable HIGH/CRITICAL findings</summary>"
            echo ""
            echo '````'
            head -c 60000 trivy-fixable.txt
            echo '````'
            echo ""
            echo "</details>"
            echo ""
            echo "The complete report (all severities, including unfixable) is attached to [this workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) as the \`trivy-full.txt\` artifact."
          } >"${body_file}"

          existing=$(gh issue list --repo "${{ github.repository }}" \
              --state open --label "${SECURITY_LABEL}" \
              --json number,title \
              --jq ".[] | select(.title == \"${ISSUE_TITLE}\") | .number" | head -n1)

          if [[ -n "${existing}" ]]; then
              gh issue edit "${existing}" --repo "${{ github.repository }}" --body-file "${body_file}"
          else
              gh issue create --repo "${{ github.repository }}" \
                  --title "${ISSUE_TITLE}" --label "${SECURITY_LABEL}" \
                  --body-file "${body_file}"
          fi
