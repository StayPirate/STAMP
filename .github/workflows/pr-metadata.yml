name: Pull Request Metadata

on:
  pull_request_target:
    branches: [master]
    types:
      - opened
      - edited
      - reopened
      - synchronize
      - ready_for_review
      - labeled
      - unlabeled

permissions:
  contents: read

jobs:
  validate:
    name: PR Metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Validate title and issue linkage
        run: python scripts/check-pr-metadata.py --event-path "${GITHUB_EVENT_PATH}"
