name: PR Metadata

on:
  pull_request:
    branches: [master]
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pr-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: PR Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title and issue linkage
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail

          title_pattern='^(feat|fix|docs|refactor|test|chore|ci)(\([a-z0-9 _-]+\))?\!?: .{1,}'
          if ! [[ "${PR_TITLE}" =~ ${title_pattern} ]]; then
            echo "::error::PR title '${PR_TITLE}' does not follow Conventional Commits format."
            echo "::error::Expected pattern: type[(scope)][!]: description (e.g. 'feat: add X', 'fix(auth)!: correct Y')"
            exit 1
          fi
          if [[ ${#PR_TITLE} -gt 71 ]]; then
            echo "::error::PR title is ${#PR_TITLE} characters; maximum is 71 (it becomes the squash commit subject, limited to 72)."
            exit 1
          fi

          # Approved automation is exempt from issue linkage only; its title
          # is still validated above.
          if [[ "${PR_AUTHOR}" == "renovate[bot]" && "${PR_HEAD_REF}" == renovate/* ]]; then
            exit 0
          fi
          if [[ "${PR_HEAD_REF}" == release-please--* ]]; then
            exit 0
          fi

          linkage_lines=$(grep -c '^- Issue linkage:' <<<"${PR_BODY}" || true)
          if [[ "${linkage_lines}" -gt 1 ]]; then
            echo "::error::PR body must contain at most one '- Issue linkage:' field (found ${linkage_lines})."
            exit 1
          fi

          if [[ "${linkage_lines}" -eq 1 ]]; then
            # Template format: validate the value after the label.
            linkage_value=$(grep '^- Issue linkage:' <<<"${PR_BODY}" | sed 's/^- Issue linkage:[[:space:]]*//')
            if [[ "${linkage_value}" =~ ^Closes\ \#[1-9][0-9]*$ ]]; then
              exit 0
            fi
            if [[ "${linkage_value}" =~ ^N/A\ -\ .*[[:graph:]].*$ ]]; then
              exit 0
            fi
            echo "::error::Issue linkage must be 'Closes #N' or 'N/A - <specific reason>' (found '${linkage_value}')."
            exit 1
          fi

          # Standalone format: a bare 'Closes #N' line anywhere in the body
          # (GitHub's native issue-closing syntax). N/A is not accepted here
          # — an exemption without the 'Issue linkage:' label is not
          # self-explanatory outside the template's structure.
          standalone_lines=$(grep -cE '^Closes #[1-9][0-9]*$' <<<"${PR_BODY}" || true)
          if [[ "${standalone_lines}" -eq 1 ]]; then
            exit 0
          fi
          echo "::error::PR body must contain exactly one issue linkage, as either '- Issue linkage: Closes #N' / '- Issue linkage: N/A - <reason>' (template format) or a standalone 'Closes #N' line (found ${standalone_lines} standalone match(es))."
          exit 1
