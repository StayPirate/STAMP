name: CodeQL

# Static Application Security Testing (SAST) via GitHub's CodeQL engine.
# Analyzes both the Python application code and the GitHub Actions
# workflow files themselves, matching the languages this repository's
# Code Scanning default-setup detection already recommends.
#
# This satisfies the OpenSSF Scorecard SAST check (see docs/deployment.md,
# Workflow Inventory): bandit (ci.yml, backend-security job) is a
# Python-specific linter that Scorecard does not recognize as a SAST
# tool — Scorecard's SAST check specifically looks for CodeQL,
# SonarCloud, or the deprecated LGTM.
#
# Non-blocking by design: findings surface as Code Scanning alerts under
# the Security tab, never as a failing status check. This workflow never
# gates a merge or touches the publish path.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    # Every Wednesday at 04:00 UTC — an off-peak slot distinct from the
    # other weekly scheduled workflows (cleanup-images.yml Sunday 03:00
    # UTC, image-scan.yml Monday 06:00 UTC, python-forward-compat.yml
    # Monday 07:00 UTC, scorecard.yml Saturday 01:30 UTC).
    - cron: "0 4 * * 3"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# Top-level permissions are fully restrictive by default (principle of
# least privilege — see docs/deployment.md, Least-privilege permissions).
# The job below declares the specific read/write scopes it needs.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: python
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
