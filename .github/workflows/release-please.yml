name: Release Please

on:
  workflow_run:
    workflows: ["CI"]
    branches: [master]
    types: [completed]

# Top-level permissions are fully restrictive by default (principle of
# least privilege — see docs/deployment.md, Least-privilege permissions).
# The write scopes below are declared at job level instead, scoped to the
# single job that needs them.
permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    # See build-images.yml for why workflow_run.branches is insufficient
    # on its own: it matches the triggering run's head branch, not the
    # base branch it targeted. See issue #96.
    if: >
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # Pinned to an exact commit SHA (not the mobile `@v5` tag) for full
      # determinism: the release PR's atomicity relies on release-please's
      # internal generic-toml updater correctly resolving the `extra-files`
      # jsonpath configured in release-please-config.json, so an unreviewed
      # action upgrade must not silently change that behavior. Dependabot
      # (.github/dependabot.yml) still proposes SHA bumps for new releases.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
