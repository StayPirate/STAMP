name: Release Please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please bumps the version in backend/pyproject.toml but does
      # not know about uv.lock. Regenerate it on the release PR branch so
      # `uv sync --locked` in CI does not fail on the version mismatch.
      - uses: actions/checkout@v7
        if: steps.release.outputs.pr
        with:
          ref: ${{ fromJSON(steps.release.outputs.pr).headBranchName }}
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.release.outputs.pr
        with:
          version: "0.11.29"

      - name: Update lockfile
        if: steps.release.outputs.pr
        working-directory: backend
        run: uv lock

      - name: Commit updated lockfile
        if: steps.release.outputs.pr
        working-directory: backend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git diff --cached --quiet || git commit -m "chore: update uv.lock for release"
          git push
