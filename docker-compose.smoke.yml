# Self-contained full-stack for OCI artifact smoke testing.
#
# Unlike docker-compose.yml (the local dev-infra stack used by
# scripts/dev-env.sh), this file is SELF-CONTAINED: it defines its own
# postgres + redis alongside the application services, and is run on its
# own (not merged as an overlay):
#
#   docker compose -f docker-compose.smoke.yml up -d --wait
#
# The canonical Docker Compose runner is scripts/image-smoke.sh.
#
# Why self-contained: postgres/redis here publish NO host ports - the
# services reach each other over the compose network only. This lets the
# smoke test run even while the dev-infra stack (scripts/dev-env.sh) is
# up on the standard host ports 5432/6379, with no conflict. The only
# published port is the api service. Docker allocates its host port and
# binds it only to 127.0.0.1; the runner discovers that mapping atomically.
#
# The runner builds or selects the application image once, resolves its
# immutable local ID, and supplies IMAGE_SMOKE_IMAGE_ID. App services have
# no build definition or mutable fallback, so they cannot substitute a
# different artifact (see
# docs/features/platform/testing-strategy.md, Image / Container Smoke
# Testing).
#
# PHASED SERVICES: services whose underlying code does not yet exist are
# commented out and are uncommented by the change that implements the
# corresponding process role, together with its smoke assertion (see
# docs/features/platform/testing-strategy.md, Image / Container Smoke
# Testing — Artifact-Risk Rule). Keeping them commented lets the argument-free
# `up --wait` stay green so the CI gate does not block `latest`
# publication before those services land. `worker` and `beat` are active
# (Celery runtime — see docs/features/platform/fetcher-infrastructure.md);
# `git-worker` remains commented out (Phase 5, git-based CVE fetchers).

x-app-common: &app-common
  image: ${IMAGE_SMOKE_IMAGE_ID:?IMAGE_SMOKE_IMAGE_ID is required}
  # Minimum configuration app/config.py requires to start without
  # crashing. JWT_SECRET_KEY is a fictional, fixed test value (>=32
  # chars) — NOT a real secret; safe to commit.
  environment:
    JWT_SECRET_KEY: image-smoke-test-secret-key-not-for-production
    DATABASE_URL: postgresql+asyncpg://sentinel:sentinel@postgres:5432/sentinel
    REDIS_URL: redis://redis:6379/0
    CELERY_BROKER_URL: redis://redis:6379/1
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # Dedicated infra for the smoke stack. No host ports are published, so
  # this coexists with scripts/dev-env.sh (which owns 5432/6379 on the
  # host) without conflict. Keep these image references aligned with the
  # bounded pre-pull list in scripts/image-smoke.sh.
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: sentinel
      POSTGRES_DB: sentinel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinel"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    <<: *app-common
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Depends on `migrate` reaching successful completion, not just on
    # infrastructure health — see docs/deployment.md (Container Images,
    # Startup Ordering). This makes the migration prerequisite
    # container-observable: an unsuccessful migration prevents the API
    # container from starting at all.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # The omitted host port requests an atomic daemon allocation. An
    # explicit host IP prevents exposure beyond the pytest host loopback.
    ports:
      - "127.0.0.1::8000"
    # Liveness probe: the runtime image is python:slim (no curl), so the
    # probe uses urllib instead. Probes /health (see
    # docs/features/platform/health-endpoints.md), which performs no
    # dependency I/O and confirms the ASGI app booted successfully.
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # One-shot schema migration, run as the image's non-root user (no
  # `user:` override here — same as `api`). `restart: no` so `up --wait`
  # treats a clean exit as success rather than a crash loop. See
  # backend/tests/image/test_migration.py for the smoke assertions this
  # step's outcome is verified against (non-root, no drift, tables and
  # named constraints present).
  migrate:
    <<: *app-common
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  # Background task execution (Celery). Depends on `migrate` reaching
  # successful completion, not just on infrastructure health — see
  # docs/deployment.md (Container Images, Startup Ordering). `--pool=prefork`
  # is explicit here (also Celery's own default) — see docs/deployment.md
  # (Celery Worker Pool Requirement): no other pool is supported. The `api`
  # service declares the same `depends_on` dependency above.
  worker:
    <<: *app-common
    command:
      [
        "celery",
        "-A",
        "app.celery_app",
        "worker",
        "--pool=prefork",
        "--loglevel=info",
      ]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "celery", "-A", "app.celery_app", "inspect", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Periodic task scheduler (Celery Beat + RedBeat). No healthcheck is
  # defined: Celery Beat exposes no broadcast-ping mechanism (that is a
  # worker-only remote-control command), and `up --wait` already treats
  # an unhealthy-by-crash container as non-running, which is a
  # sufficient startup signal here. Beat's actual schedule registration
  # is verified by the image test suite via RedBeat's public API (see
  # backend/tests/image/test_celery.py).
  beat:
    <<: *app-common
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  # --- Uncomment in Phase 5 (git-based CVE fetchers) ---
  # git-worker:
  #   <<: *app-common
  #   command: ["celery", "-A", "app.celery_app", "worker", "-Q", "git", "--pool=prefork", "--loglevel=info"]
