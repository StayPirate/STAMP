# Gitleaks configuration for Sentinel.
#
# Used by the local pre-commit hook only (.githooks/pre-commit) — there
# is no CI job or GitHub Action for secret scanning, by design. See
# docs/features/platform/testing-strategy.md (Pre-Commit Hooks).
#
# This file extends gitleaks' built-in default rule set (it does not
# replace it). No repository-specific allowlist is defined today:
# verification during implementation confirmed the default rule set
# does not flag any of the fictional/placeholder values currently used
# in tests, examples, or documentation (fictional bcrypt hashes,
# "not-for-production" markers, documentation placeholders). If a real
# false positive is observed in the future, add a pattern-based (never
# path-based) [[allowlists]] table here — see
# https://github.com/gitleaks/gitleaks#configuration for the format.
title = "Sentinel gitleaks config"

[extend]
useDefault = true
